                  - generic [ref=e132]:
                    - generic [ref=e133]:
                      - generic [ref=e134] [cursor=pointer]:
                        - generic [ref=e135]: Is there a direct shuttle bus connection from Antwerp to Brussels Zaventem Airport?
                        - text: 
                      - paragraph [ref=e138]: Yes, there is a regular shuttle bus service running between the Franklin Rooseveltplaats in Antwerp and Brussels Zaventem Airport. The buses run in both directions and offer a comfortable, direct connection with reliable departure times.
                    - generic [ref=e139]:
                      - generic [ref=e140] [cursor=pointer]:
                        - generic [ref=e141]: How do I get from Brussels-Zaventem airport to Antwerp?
                        - text: 
                      - paragraph [ref=e144]: Flibco's shuttle bus will get you to Antwerp city centre quickly and comfortably. The buses run regularly and offer comfortable seats and free wi-fi. You can easily buy tickets online or directly at the airport.
                    - generic [ref=e145]:
                      - generic [ref=e146] [cursor=pointer]:
                        - generic [ref=e147]: How often do the shuttle buses run?
                        - text: 
                      - paragraph [ref=e150]: The Flibco shuttle buses run several times a day, approximately every 1 to 2 hours, between Brussels-Zaventem airport and Antwerp. So you can flexibly choose your departure time and plan your trip optimally.
                    - generic [ref=e151]:
                      - generic [ref=e152] [cursor=pointer]:
                        - generic [ref=e153]: Do the buses run all day?
                        - text: 
                      - paragraph [ref=e156]: The shuttle buses do not run 24 hours a day, but they do offer several daily connections between Zaventem airport and Antwerp. The schedules are aligned with the main flight times, so you can easily arrive and depart.
                    - generic [ref=e157]:
                      - generic [ref=e158] [cursor=pointer]:
                        - generic [ref=e159]: How long does the journey take between Antwerp and Zaventem?
                        - text: 
                      - paragraph [ref=e162]: Travel time by shuttle bus between Brussels-Zaventem Airport and Antwerp is usually around 50 minutes, depending on traffic. This direct and comfortable connection ensures you arrive in the city centre or at the airport without stress.
                    - generic [ref=e163]:
                      - generic [ref=e164] [cursor=pointer]:
                        - generic [ref=e165]: What does a bus trip from Antwerp to Zaventem airport cost?
                        - text: 
                      - paragraph [ref=e168]:
                        - generic [ref=e169]:
                          - text: The cost of a bus trip with Flibco from Brussels-Zaventem Airport to Antwerp starts from
                          - strong [ref=e170]
                        - strong [ref=e172]: €4,99
                        - generic [ref=e173]:
                          - strong [ref=e174]: per trip
                          - text: . The exact price varies depending on the time of booking and availability, but always offers excellent value for money for a comfortable journey.
                    - generic [ref=e175]:
                      - generic [ref=e176] [cursor=pointer]:
                        - generic [ref=e177]: How and where can I buy a ticket?
                        - text: 
                      - paragraph [ref=e180]: You can easily buy your ticket for the Flibco shuttle bus online via the official website or the mobile app. In addition, tickets are sometimes also available directly at the airport and in Antwerp. Various payment methods are available.
                    - generic [ref=e181]:
                      - generic [ref=e182] [cursor=pointer]:
                        - generic [ref=e183]: Can I change my ticket?
                        - text: 
                      - generic [ref=e185]:
                        - paragraph [ref=e186]: Yes, you can cancel or change your booking up to 6 hours before the scheduled departure time.
                        - paragraph [ref=e187]:
                          - generic [ref=e188]:
                            - strong [ref=e189]: "For flibco.com account users:"
                            - text: To do so, log in to your account with your email and password, go to the "Planned Trips" section and edit or cancel the relevant booking. The cost of the booking will be credited to your Flibco account, and the amount will be automatically deducted from your next booking.
                        - paragraph [ref=e190]:
                          - generic [ref=e191]:
                            - strong [ref=e192]: "For guest users:"
                            - text: go to
                          - link "Manage Booking" [ref=e193] [cursor=pointer]:
                            - /url: https://www.flibco.com/en/search-booking
                          - text: and search for your booking with your ticket number and the email address used for the purchase. There you can edit or cancel your ticket and have the booking cost credited to a Flibco account or simply create an account to use your credit for your next booking.
                    - generic [ref=e194]:
                      - generic [ref=e195] [cursor=pointer]:
                        - generic [ref=e196]: What happens if I miss my shuttle bus or my flight is delayed?
                        - text: 
                      - paragraph [ref=e199]: If you miss your departure, for example, due to a flight delay, you can take the next available bus free of charge if there are seats.
                    - generic [ref=e200]:
